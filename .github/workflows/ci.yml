name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Homey CLI
        run: npm install --global homey@4.6.3

      - name: Check tracked runtime files
        run: npm run check:source

      - name: Run unit tests
        run: npm test

      - name: Validate the app
        run: homey app validate --level verified

      - name: Build the app
        run: homey app build
