<style>
  :root {
    color-scheme: light dark;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background: var(--homey-background-color, #f7f8f8);
  }

  .duka {
    box-sizing: border-box;
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 18px 36px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--homey-text-color, #1c1c1e);
    background: var(--homey-background-color, #f7f8f8);
  }

  .duka h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 700;
  }

  .duka p {
    margin: 0 0 14px;
    font-size: 14px;
    line-height: 1.45;
    color: var(--homey-text-color-secondary, #63666b);
  }

  .duka h2 {
    margin: 26px 0 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--homey-text-color-secondary, #7b7f85);
  }

  .duka .card {
    padding: 14px;
    border-radius: 14px;
    background: var(--homey-card-color, #ffffff);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }

  .duka .row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .duka button {
    appearance: none;
    border: 0;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    padding: 11px 16px;
    cursor: pointer;
    font-family: inherit;
  }

  .duka button:disabled {
    opacity: 0.55;
    cursor: default;
  }

  .duka .primary {
    width: 100%;
    margin-top: 18px;
    color: #ffffff;
    background: var(--homey-color-primary, #0e6b5c);
  }

  .duka .secondary {
    color: var(--homey-color-primary, #0e6b5c);
    background: rgba(14, 107, 92, 0.12);
    white-space: nowrap;
  }

  .duka .status {
    margin-top: 12px;
    font-size: 13px;
    line-height: 1.4;
    min-height: 18px;
    color: var(--homey-text-color-secondary, #63666b);
  }

  .duka .status.error {
    color: var(--homey-color-error, #c62828);
  }

  .duka .devices {
    margin-top: 12px;
    display: grid;
    gap: 8px;
  }

  .duka .device {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--homey-line-color, #e3e5e8);
    background: var(--homey-card-color, #ffffff);
    cursor: pointer;
  }

  .duka .device input {
    margin: 0;
    accent-color: var(--homey-color-primary, #0e6b5c);
  }

  .duka .device-id {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .duka .device-address {
    margin-left: auto;
    font-size: 12px;
    color: var(--homey-text-color-secondary, #7b7f85);
  }

  .duka label.field {
    display: block;
    margin-top: 12px;
    font-size: 13px;
    font-weight: 600;
  }

  .duka label.field span.hint {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    font-weight: 400;
    color: var(--homey-text-color-secondary, #7b7f85);
  }

  .duka input[type="text"],
  .duka input[type="password"] {
    box-sizing: border-box;
    width: 100%;
    margin-top: 6px;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px solid var(--homey-line-color, #d9dcdf);
    background: var(--homey-input-color, #fbfbfb);
    color: inherit;
    font-size: 15px;
    font-family: inherit;
  }

  .duka .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 26px 0 4px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--homey-text-color-secondary, #8a8e93);
  }

  .duka .divider::before,
  .duka .divider::after {
    content: "";
    height: 1px;
    flex: 1;
    background: var(--homey-line-color, #e3e5e8);
  }

  @media (prefers-color-scheme: dark) {
    html,
    body {
      background: #141617;
    }

    .duka {
      color: #f2f3f4;
      background: #141617;
    }

    .duka p,
    .duka .status,
    .duka label.field span.hint,
    .duka .device-address,
    .duka h2,
    .duka .divider {
      color: #a7acb1;
    }

    .duka .card,
    .duka .device {
      background: #1d2022;
    }

    .duka .device,
    .duka input[type="text"],
    .duka input[type="password"] {
      border-color: #33383c;
    }

    .duka input[type="text"],
    .duka input[type="password"] {
      background: #17191b;
    }
  }
</style>

<div class="duka">
  <h1 id="title">Add a DUKA</h1>
  <p id="intro">
    Search your network for DUKA units, or enter the device ID from the DUKA app.
  </p>

  <div class="row">
    <button type="button" class="secondary" id="searchButton">Search</button>
    <span class="status" id="searchStatus"></span>
  </div>

  <div class="devices" id="devices"></div>

  <div class="divider" id="manualDivider">or enter it manually</div>

  <div class="card">
    <label class="field" for="deviceId">
      <span id="deviceIdLabel">Device ID</span>
      <span class="hint" id="deviceIdHint">Shown in the DUKA app under device information.</span>
      <input type="text" id="deviceId" autocomplete="off" autocapitalize="characters" spellcheck="false" />
    </label>

    <label class="field" for="password">
      <span id="passwordLabel">Password</span>
      <input type="password" id="password" value="1111" autocomplete="off" />
    </label>

    <label class="field" for="address">
      <span id="addressLabel">IP address (optional)</span>
      <span class="hint" id="addressHint">Leave empty to use the network broadcast address.</span>
      <input type="text" id="address" autocomplete="off" spellcheck="false" />
    </label>

    <label class="field" for="name">
      <span id="nameLabel">Name</span>
      <input type="text" id="name" value="DUKA" autocomplete="off" />
    </label>
  </div>

  <button type="button" class="primary" id="addButton">Add device</button>
  <div class="status" id="addStatus"></div>
</div>

<script type="application/javascript">
  window.DUKA_FAMILY = "s6w";
</script>

<script type="application/javascript">
  (function () {
    "use strict";

    var FAMILY = window.DUKA_FAMILY || "s6w";
    var IS_SMART = FAMILY === "smart";
    var booted = false;
    var HomeyRef = null;
    var busy = false;
    var attempts = 0;

    function t(key, fallback) {
      try {
        if (HomeyRef && typeof HomeyRef.__ === "function") {
          var value = HomeyRef.__(key);
          if (value && value !== key) return value;
        }
      } catch (err) {
        // Fall back to the English string below.
      }
      return fallback;
    }

    function byId(id) {
      return document.getElementById(id);
    }

    function setText(id, value) {
      var element = byId(id);
      if (element) element.textContent = value;
    }

    function showError(message) {
      var element = byId("addStatus");
      element.textContent = message;
      element.className = "status error";
    }

    function clearError() {
      var element = byId("addStatus");
      element.textContent = "";
      element.className = "status";
    }

    function setBusy(isBusy) {
      busy = isBusy;
      byId("searchButton").disabled = isBusy;
      byId("addButton").disabled = isBusy;
    }

    function renderDevices(devices) {
      var list = byId("devices");
      list.innerHTML = "";

      if (!devices.length) {
        return;
      }

      devices.forEach(function (device) {
        var label = document.createElement("label");
        label.className = "device";

        var radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "duka-device";
        radio.value = device.id;
        radio.addEventListener("change", function () {
          byId("deviceId").value = device.id;
          byId("address").value = device.address || "";
        });

        var id = document.createElement("span");
        id.className = "device-id";
        id.textContent = device.id;

        var address = document.createElement("span");
        address.className = "device-address";
        address.textContent = device.address || "";

        label.appendChild(radio);
        label.appendChild(id);
        label.appendChild(address);
        list.appendChild(label);
      });
    }

    function search() {
      if (busy) return;
      clearError();
      setBusy(true);
      renderDevices([]);
      setText("searchStatus", t("pair.searching", "Searching for units..."));

      HomeyRef.emit("search")
        .then(function (devices) {
          var found = devices || [];
          renderDevices(found);
          if (found.length === 0) {
            setText("searchStatus", t("pair.noneFound", "No units answered. Enter the device ID manually."));
          } else if (found.length === 1) {
            setText("searchStatus", t("pair.oneFound", "Found 1 unit."));
            byId("deviceId").value = found[0].id;
            byId("address").value = found[0].address || "";
            document.querySelectorAll('input[name="duka-device"]')[0].checked = true;
          } else {
            setText("searchStatus", t("pair.severalFound", "Found several units. Pick one below."));
          }
        })
        .catch(function (err) {
          setText("searchStatus", "");
          showError(err && err.message ? err.message : String(err));
        })
        .then(function () {
          setBusy(false);
        });
    }

    function add() {
      if (busy) return;
      clearError();

      var deviceId = byId("deviceId").value.trim().toUpperCase();
      if (!deviceId) {
        showError(t("pair.errors.device_id", "Enter the device ID."));
        return;
      }

      var password = byId("password").value.trim() || "1111";
      var address = byId("address").value.trim() || null;
      var name = byId("name").value.trim() || (IS_SMART ? "DUKA smart fan" : "DUKA S6W");

      setBusy(true);
      setText("addStatus", t("pair.verifying", "Contacting the unit..."));

      HomeyRef.emit("add", {
        deviceId: deviceId,
        password: password,
        address: address
      })
        .then(function (info) {
          return HomeyRef.createDevice({
            name: name,
            data: { id: info.id },
            store: {
              password: info.password,
              address: info.address || "",
              manualSpeed: info.manualSpeed === true,
              family: FAMILY
            }
          });
        })
        .then(function () {
          HomeyRef.done();
        })
        .catch(function (err) {
          showError(err && err.message ? err.message : String(err));
        })
        .then(function () {
          setBusy(false);
        });
    }

    function boot(Homey) {
      if (booted) return;
      booted = true;
      HomeyRef = Homey;

      setText("title", t(IS_SMART ? "pair.titleSmart" : "pair.titleS6w", IS_SMART ? "Add a DUKA smart fan" : "Add a DUKA S6W"));
      setText("intro", t(IS_SMART ? "pair.introSmart" : "pair.introS6w", IS_SMART ? "Search your network for DUKA smart fans, or enter the device ID from the DUKA app." : "Search your network for DUKA S6W units, or enter the device ID from the DUKA app."));
      setText("searchButton", t("pair.search", "Search"));
      setText("manualDivider", t("pair.orManual", "or enter it manually"));
      setText("deviceIdLabel", t("pair.deviceId", "Device ID"));
      setText("deviceIdHint", t("pair.deviceIdHint", "Shown in the DUKA app under device information."));
      setText("passwordLabel", t("pair.password", "Password"));
      setText("addressLabel", t("pair.address", "IP address (optional)"));
      setText("addressHint", t("pair.addressHint", "Leave empty to use the network broadcast address."));
      setText("nameLabel", t("pair.name", "Name"));
      setText("addButton", t("pair.add", "Add device"));

      byId("name").value = IS_SMART ? "DUKA smart fan" : "DUKA S6W";

      byId("searchButton").addEventListener("click", search);
      byId("addButton").addEventListener("click", add);
    }

    window.onHomeyReady = boot;

    var timer = setInterval(function () {
      if (typeof Homey !== "undefined") {
        clearInterval(timer);
        boot(Homey);
      } else if (++attempts > 100) {
        clearInterval(timer);
      }
    }, 50);
  })();
</script>
